<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分享收件箱 - iDing's临时邮箱</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/app-sidebar.css" />
  <link rel="stylesheet" href="/css/app-mailbox.css" />
  <link rel="stylesheet" href="/css/app-modal.css" />
  <link rel="stylesheet" href="/css/app-responsive.css" />
  <link rel="stylesheet" href="/css/mailbox.css" />
  <link rel="stylesheet" href="/css/app_black.css" />
  <link rel="stylesheet" href="/css/mailbox_black.css" />
  <script src="/js/theme-toggle.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <use href="/icons/sprites.svg#icon-mail"/>
        </svg>
      </span>
      <span class="brand-text">iDing's临时邮箱</span>
    </div>
    <div id="role-badge" class="role-badge" title="分享的收件箱">分享的收件箱</div>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="https://github.com/idinging/freemail" target="_blank" rel="noopener noreferrer" title="GitHub 开源仓库">
        <span class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <use href="/icons/sprites.svg#icon-github"/>
          </svg>
        </span>
        <span class="btn-text">GitHub</span>
      </a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 过期/无效提示（默认隐藏） -->
<div id="share-expired" class="container mailbox-container" style="display:none">
  <div class="main mailbox-main">
    <div class="card mailbox-info-card" style="text-align:center;padding:3rem 1.5rem">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" style="margin:0 auto 1rem">
        <use href="/icons/sprites.svg#icon-alert"/>
      </svg>
      <h2 id="share-error-title" style="margin-bottom:0.5rem">分享链接无效或已过期</h2>
      <p id="share-error-desc" style="color:var(--text-secondary)">该链接可能已被撤销或已超过有效期</p>
    </div>
  </div>
</div>

<!-- 主内容区 -->
<div id="share-content" class="container mailbox-container" style="display:none">
  <div class="main mailbox-main">
    <!-- 邮箱信息卡片 -->
    <div class="card mailbox-info-card">
      <h2>
        <span class="card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <use href="/icons/sprites.svg#icon-inbox"/>
          </svg>
        </span>
        分享的收件箱
      </h2>
      <div class="mailbox-info">
        <div class="mailbox-display">
          <span class="mailbox-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-mail"/>
            </svg>
          </span>
          <span id="current-mailbox" class="mailbox-address">加载中...</span>
        </div>
        <div class="mailbox-toolbar">
          <div class="toolbar-left">
            <span id="share-expires-hint" class="chip" style="display:none"></span>
          </div>
          <div class="toolbar-right">
            <label class="toggle" title="开启后按间隔自动刷新">
              <input id="auto-refresh" type="checkbox" />
              <span>自动刷新</span>
            </label>
            <select id="refresh-interval" class="select select-sm" title="刷新间隔" aria-label="刷新间隔">
              <option value="10">10秒</option>
              <option value="30" selected>30秒</option>
              <option value="60">60秒</option>
            </select>
            <input id="search-box" class="input input-sm" placeholder="搜索发件人/主题" aria-label="搜索发件人或主题" />
            <button id="clear-filter" class="btn btn-ghost btn-sm" title="清空筛选">清空</button>
            <button id="refresh-emails" class="btn btn-ghost" title="立即刷新" aria-label="刷新邮件列表">
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <use href="/icons/sprites.svg#icon-refresh"/>
                </svg>
              </span>
              <span>刷新</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 收件箱卡片 -->
    <div class="card inbox-card">
      <div class="listcard-header">
        <h2 class="listcard-title">
          <span class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-mail"/>
            </svg>
          </span>
          <span>收件箱</span>
        </h2>
        <div id="list-loading" class="loading-indicator no-pointer" role="status" aria-live="polite">
          <div class="spinner"></div>
          <span>加载中…</span>
        </div>
      </div>
      <div class="list-viewport">
        <div id="email-list" class="list"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-content">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
              <use href="/icons/sprites.svg#icon-inbox-empty"/>
            </svg>
            <span>暂无邮件</span>
          </div>
        </div>
        <div id="list-pager" class="pager" style="display:none">
          <button id="prev-page" class="btn btn-ghost btn-sm">上一页</button>
          <span id="page-info" class="muted page-info-center"></span>
          <button id="next-page" class="btn btn-ghost btn-sm">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-slot"></div>

<!-- 邮件详情模态框 -->
<div class="modal" id="email-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div id="modal-subject">
        <span class="modal-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <use href="/icons/sprites.svg#icon-mail"/>
          </svg>
        </span>
        <span>邮件详情</span>
      </div>
      <button id="modal-close" class="close" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <use href="/icons/sprites.svg#icon-x"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script src="/js/toast-utils.js"></script>
<script type="module" src="/js/share.js"></script>
<script>
  (async function(){
    try{
      const res = await fetch('/templates/footer.html', { cache: 'no-cache' });
      const html = await res.text();
      const slot = document.getElementById('footer-slot');
      if (slot){
        slot.outerHTML = html;
        setTimeout(()=>{ const y=document.getElementById('footer-year'); if (y) y.textContent=new Date().getFullYear(); },0);
      }
    }catch(_){ }
  })();
</script>
</body>
</html>
