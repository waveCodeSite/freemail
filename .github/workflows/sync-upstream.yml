name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync master from upstream
        run: |
          git remote add upstream https://github.com/idinging/freemail.git || true
          git fetch upstream
          git checkout master
          git merge upstream/master

      - name: Push synced master
        run: |
          git push origin master
